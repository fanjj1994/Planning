vehicle:
  ego_car:
    id: 0 #　car id
    frame: "base_footprint" #　coordinate name
    length: 3.0 #　ego car length
    width: 1.5 #  ego car width
    pose_x: 0.0 #  ego car x
    pose_y: 0.0 #　ego car y
    pose_theta: 0.0 #　ego car heading
    set_speed: 1.0 #　ego car set speed
  tp_car1:
    id: 1 #　car id
    frame: "base_footprint_tp1" #  coordinate name
    length: 8.0 # tp car length
    width: 2.6 #  tp car width
    pose_x: 65.0 #  tp car x
    pose_y: 30.0 #　tp car y
    pose_theta: -1.57 #  tp car heading
    set_speed: 0.5 #  tp car set speed
  tp_car2:
    id: 2
    frame: "base_footprint_tp2"
    length: 6.0
    width: 2.0
    pose_x: 120.0
    pose_y: -75.0
    pose_theta: 1.57
    set_speed: 0.5
  tp_car3:
    id: 3
    frame: "base_footprint_tp3"
    length: 3.0
    width: 7.6
    pose_x: 180.0
    pose_y: 0.0
    pose_theta: 0.0
    set_speed: 0.0

pnc_map:
  frame: "map" # coordinate name
  type: 0 #　enum,　0:straight, 1:sturn
  road_length: 1250.0 #  road length
  road_half_width: 4.0 #  half width of road
  segment_len: 0.5 #　segment length
  speed_limit: 1.0 #  speed limit

global_path:
  type: 0 # enum,　0:normal, 1: astar

local_path:
  curve_type: 2 #　enum,　0:first order polynomial, 1:third order polynomial, 2:fifth order polynomial
  path_size: 80 # path point size

local_speeds:
  speeds_size: 100 #　velocity point

reference_line:
  type: 0 # enum,　0:normal, 1:stich
  front_size: 200 #　front size point size
  back_size: 80 #  back size point size

decision:
  lat_safe_margin: 0.5 #　lateral safe margin
  long_safe_margin: 20.0 #　longitudinal safe margin

planning_process:
  perception_range: 100.0 #　perception range

move_cmd:
